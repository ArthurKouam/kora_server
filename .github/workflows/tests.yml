name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test unit
        env:
          NODE_ENV: test
          HOST: localhost
          PORT: '3333'
          LOG_LEVEL: info
          APP_KEY: ci-only-test-key-not-a-real-secret
          APP_URL: http://localhost:3333
          SESSION_DRIVER: memory
          DB_CONNECTION: sqlite
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_USER: ci
          DB_PASSWORD: ci
          DB_DATABASE: ci
